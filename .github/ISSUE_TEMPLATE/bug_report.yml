name: Bug report
description: Algo no se comporta como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por el reporte. Esta app gestiona dinero, así que los detalles
        exactos del entorno valen más que una descripción vaga.

  - type: textarea
    id: what-happened
    attributes:
      label: Qué ocurre
      description: Qué esperabas y qué ha pasado en su lugar.
      placeholder: |
        Esperaba que el importe aportado se recalculara al fijar el porcentaje.
        Se quedó en el valor anterior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Iniciar sesión como usuario A
        2. Ir a /aportar y fijar el sueldo
        3. ...
    validations:
      required: true

  - type: input
    id: area
    attributes:
      label: Área
      description: Qué parte de la app.
      placeholder: Cuenta conjunta / individual / login / histórico / alta de gasto
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión o commit
      description: La URL del preview de Vercel donde lo viste, o el hash de commit.
      placeholder: Vercel preview URL, o `a1b2c3d`
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - Preview (rama develop)
        - Producción (rama master)
        - Local (npm run dev)
        - No estoy seguro
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Dispositivo y navegador
      options:
        - iPhone (Safari, PWA instalada)
        - iPhone (Safari en pestaña)
        - Android (Chrome)
        - Escritorio
        - Otro
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Contexto adicional
      description: Capturas, logs del navegador, o cualquier otro detalle.